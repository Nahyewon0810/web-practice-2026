<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기</title>

    <meta name="description" content="제주대학교 문의하기 페이지입니다.">
    <meta property="og:url" content="https://www.jejunu.ac.kr/">
    <meta property="og:title" content="문의하기">
    <meta property="og:description" content="문의사항이 있을 시 해당 링크를 통해 메시지 남겨주시길 바랍니다.">
</head>
<body>
    <header>
        <img src="./symbol.png" alt="제주대학교 로고" width="200">
        <span>문의 페이지</span>
    </header>
    <main>
        <br>
        <img src="./image.png" alt="홈페이지의 대표 이미지. 제주대학교의 간판이 세워져 있는 사진" width="600">
        <form>
        <fieldset>
            <legend>문의하기</legend>
            <label for="name">이름</label>
            <input type="text" id="name" />

            <br>
            <label for="email">이메일</label>
            <input type="email" id="email" />

            <br>
            <br>
            <label for="question">문의유형</label>
            <select id="question">
                <option value="admission" selected>입학</option>
                <option value="scholarship" >장학</option>
                <option value="etc">기타</option>
            </select>

            <br>
            <label for="message">문의내용</label>
            <textarea id="message"></textarea>

            <button type="submit">보내기</button>
        </fieldset>
    </form>
    </main>
    <footer>
        <p>Copyright (c) 2026 나혜원.</p>
        <a href="mailto:nahyewon0810@gmail.com">nahyewon0810@gmail.com</a>
    </footer>
</body>
</html>
