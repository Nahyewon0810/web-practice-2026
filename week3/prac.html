    <h1>이미지 태그</h1>

    <h1 id="1">오디오 태그</h1>
    <audio src="https://3212f96f-ea0f-4876-90e4-a727cccdc62e.mdnplay.dev/shared-assets/audio/t-rex-roar.mp3" controls></audio>

    <h1>비디오 태그</h1>
    <video src="https://c1e38f75-acdf-48cf-b2ce-1d6f3688b64f.mdnplay.dev/shared-assets/videos/flower.webm" controls></video>


    <h1>폼태그</h1>
    <form>
        <fieldset>
            <legend>인풋태그</legend>
            <label for="id">아이디</label>
            <input type="text" id="id "/>

            <label for="password">비밀번호</label>
            <input type="password" id="password" />

            <label for="email">이메일</label>
            <input type="email" id="email" />

            <label for="tel">전화번호</label>
            <input type="tel" id="tel" />

            <h2>체크박스 (좋아하는 숫자를 선택하세요)</h2>
            <label for="1">1</label>
            <input type="checkbox" id="1" />
            <label for="2">2</label>
            <input type="checkbox" id="2" />
            <label for="3">3</label>
            <input type="checkbox" id="3" />
            <label for="4">4</label>
            <input type="checkbox" id="4" />

            <h2>라디오 버튼 (좋아하는 과일을 1가지만 선택하세요)</h2>
            <label for="apple">사과</label>
            <input type="radio" name="fruit" id="apple" />
            <label for="banana">바나나</label>
            <input type="radio" name="fruit" id="banana" />
            <label for="peach">복숭아</label>
            <input type="radio" name="fruit" id="peach" />

            <h2>파일</h2>
            <input type="file" />

            <h2>기타 폼요소</h2>
            <label for="1">문의내용</label>
            <textarea id="1"></textarea>

            <label for="2">문의유형</label>
            <select id="2">
                <option value="a">배송</option>
                <option value="b" selected>주문</option>
                <option value="c">기타</option>
            </select>

            <button type="button">클릭</button>
        </fieldset>
    </form>



</body>
</html>
